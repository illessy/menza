<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafeteria Feedback</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: #111827;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
    }
    h1 { font-size: 3rem; margin-bottom: 2rem; }
    .buttons { display: flex; gap: 2rem; }
    .btn {
      font-size: 5rem;
      background: #1f2937;
      border: 4px solid #374151;
      border-radius: 24px;
      padding: 2rem;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.9); }
    #thanks {
      display: none;
      font-size: 4rem;
      color: #10b981;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="survey">
    <h1>How was lunch today?</h1>
    <div class="buttons">
      <button class="btn" onclick="sendRating('Great')">😃</button>
      <button class="btn" onclick="sendRating('Good')">🙂</button>
      <button class="btn" onclick="sendRating('Okay')">😐</button>
      <button class="btn" onclick="sendRating('Bad')">🙁</button>
    </div>
  </div>

  <div id="thanks">Thank You! 👍</div>

  <script>
    function sendRating(rating) {
      // 1. Send data in the background (e.g., to Google Sheets webhook)
      fetch('YOUR_WEBHOOK_URL_HERE', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rating: rating, timestamp: new Date().toISOString() })
      }).catch(err => console.log('Log recorded'));

      // 2. Instant UI reset (1 second delay)
      document.getElementById('survey').style.display = 'none';
      document.getElementById('thanks').style.display = 'block';

      setTimeout(() => {
        document.getElementById('thanks').style.display = 'none';
        document.getElementById('survey').style.display = 'block';
      }, 1000);
    }
  </script>
</body>
</html>
