<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cafeteria Satisfaction Kiosk</title>
<style>
  :root {
    --bg: #f5f1ea;
    --card: #ffffff;
    --text: #2b2620;
    --muted: #7a7166;
    --accent: #c1440e;
    --good: #3a7d44;
    --ok: #d9a441;
    --bad: #b3392c;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a17;
      --card: #2a2620;
      --text: #f2ede4;
      --muted: #b0a89c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1a17;
    --card: #2a2620;
    --text: #f2ede4;
    --muted: #b0a89c;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  html { height: 100%; }
  .wrap {
    width: 100%;
    max-width: 900px;
    padding: 24px;
    text-align: center;
  }
  h1 {
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    margin: 0 0 8px;
  }
  p.sub {
    color: var(--muted);
    font-size: clamp(1rem, 2vw, 1.25rem);
    margin: 0 0 40px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  button.rate {
    background: var(--card);
    border: none;
    border-radius: 20px;
    padding: 32px 12px;
    font-size: clamp(2.5rem, 6vw, 4rem);
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    transition: transform 0.08s ease;
    color: var(--text);
  }
  button.rate:active { transform: scale(0.93); }
  button.rate .label {
    display: block;
    font-size: clamp(0.85rem, 1.6vw, 1.05rem);
    margin-top: 10px;
    color: var(--muted);
    font-weight: 600;
  }
  .thanks {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 700;
  }
  .thanks .icon { font-size: clamp(4rem, 10vw, 6rem); display:block; margin-bottom: 12px; }
  .hidden { display: none; }
  footer {
    margin-top: 32px;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="askScreen">
    <h1>How was your meal today?</h1>
    <p class="sub">Tap a button to let us know</p>
    <div class="grid">
      <button class="rate" data-rating="1" data-label="Poor" style="border-top:6px solid var(--bad)">😞<span class="label">Poor</span></button>
      <button class="rate" data-rating="2" data-label="Fair" style="border-top:6px solid var(--ok)">😐<span class="label">Fair</span></button>
      <button class="rate" data-rating="3" data-label="Good" style="border-top:6px solid var(--good)">🙂<span class="label">Good</span></button>
      <button class="rate" data-rating="4" data-label="Great" style="border-top:6px solid var(--good)">😃<span class="label">Great</span></button>
    </div>
    <footer>Your response is anonymous. Thank you for helping us improve!</footer>
  </div>

  <div id="thanksScreen" class="hidden thanks">
    <span class="icon">✅</span>
    Thanks for your feedback!
  </div>
</div>

<script>
(function () {
  const askScreen = document.getElementById('askScreen');
  const thanksScreen = document.getElementById('thanksScreen');
  let dbNS = null;

  async function initDb() {
    try {
      dbNS = await window.claude.use('db');
    } catch (e) {
      dbNS = null;
    }
  }
  if (window.claude && window.claude.use) initDb();

  async function saveResponse(rating, label) {
    const entry = {
      rating: rating,
      label: label,
      ts: Date.now(),
      dateStr: new Date().toISOString()
    };
    // Primary: built-in db capability
    try {
      if (dbNS) {
        const id = 'r_' + entry.ts + '_' + Math.random().toString(36).slice(2, 8);
        await dbNS.collection('responses').doc(id).set(entry);
        return;
      }
    } catch (e) {
      console.error('db save failed', e);
    }
    // Fallback: local queue so nothing is lost if db isn't available
    try {
      const key = 'kiosk_pending_responses';
      const existing = JSON.parse(localStorage.getItem(key) || '[]');
      existing.push(entry);
      localStorage.setItem(key, JSON.stringify(existing));
    } catch (e) {
      console.error('local fallback failed', e);
    }

    // --- To send to a Google Sheet instead/also, replace this whole function body with: ---
    // await fetch('YOUR_APPS_SCRIPT_WEB_APP_URL', {
    //   method: 'POST',
    //   headers: { 'Content-Type': 'application/json' },
    //   body: JSON.stringify(entry)
    // });
  }

  document.querySelectorAll('button.rate').forEach(btn => {
    btn.addEventListener('click', async () => {
      const rating = btn.getAttribute('data-rating');
      const label = btn.getAttribute('data-label');
      await saveResponse(rating, label);
      askScreen.classList.add('hidden');
      thanksScreen.classList.remove('hidden');
      setTimeout(() => {
        thanksScreen.classList.add('hidden');
        askScreen.classList.remove('hidden');
      }, 2500);
    });
  });
})();
</script>
</body>
</html>
